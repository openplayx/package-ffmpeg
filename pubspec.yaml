name: openplayx_ffmpeg
description: In-process FFmpeg media processing (probe, snapshot, remux, transcode) for OpenPlayX through a small FFI C ABI. No ffmpeg/ffprobe processes.
publish_to: none
repository: https://github.com/openplayx/package-ffmpeg
version: 0.1.0
environment:
  sdk: ^3.13.7
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
